<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ObraFácil — Orçamentos no canteiro de obras">
  <meta name="theme-color" content="#1a5276">
  <title>ObraFácil</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/accessibility.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Ir para o conteúdo principal</a>

  <header role="banner">
    <h1>ObraFácil</h1>
    <p class="subtitle">Orçamentos no canteiro de obras</p>
  </header>

  <nav role="navigation" aria-label="Menu principal">
    <ul class="nav-list">
      <li><a href="#calculos" aria-current="page">Cálculos</a></li>
      <li><a href="#orcamentos">Orçamentos</a></li>
      <li><a href="#materiais">Materiais</a></li>
    </ul>
  </nav>

  <main id="main-content" role="main">
    <section id="calculos" aria-labelledby="calculos-title">
      <h2 id="calculos-title">Calculadora de Área</h2>
      <form id="form-area" aria-describedby="area-help">
        <p id="area-help" class="help-text">Informe comprimento e largura em metros.</p>
        <div class="form-group">
          <label for="comprimento">Comprimento (m)</label>
          <input type="number" id="comprimento" min="0" step="0.01" inputmode="decimal" required aria-required="true">
        </div>
        <div class="form-group">
          <label for="largura">Largura (m)</label>
          <input type="number" id="largura" min="0" step="0.01" inputmode="decimal" required aria-required="true">
        </div>
        <button type="submit" class="btn-primary" aria-label="Calcular área">Calcular área</button>
      </form>
      <output id="resultado-area" role="status" aria-live="polite" aria-atomic="true"></output>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2026 ObraFácil</p>
    <p id="offline-status" aria-live="polite"></p>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(console.warn);
    }
  </script>
</body>
</html>
