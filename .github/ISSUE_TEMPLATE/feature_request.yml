name: Feature Request
description: Sugerir uma nova funcionalidade
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual problema esta feature resolve?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área do projeto
      options:
        - Backend
        - Frontend
        - Documentação
        - CI / Deploy
        - Outro
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
